# Builds the deployment image on GitHub's runners and publishes it to ghcr.io,
# so the deployment host only has to pull it. Building on the host itself needs
# the whole monorepo toolchain and more RAM than a small VPS has.
#
# This is deliberately separate from docker.yml, which builds the upstream
# release matrix (multi-arch plus a cloud variant). Keeping them apart means a
# sync with upstream never conflicts with this file.
name: Deploy Image

on:
  push:
    branches:
      - master
  # Lets you trigger a build by hand from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  # Required for the GITHUB_TOKEN to push to ghcr.io.
  packages: write

# A newer push supersedes a pending build. The deployment only ever wants the
# newest commit, so cancelling an in-flight run costs nothing.
concurrency:
  group: deploy-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Tags and full history so `git describe` below can compute a version.
          fetch-depth: 0

      # .git is dockerignored, so the running image cannot derive its own
      # version. Compute it here and pass it in as a build arg. Empty when no
      # release tag is reachable, which leaves the server on its own fallbacks.
      - name: Compute build version
        id: version
        run: |
          set -euo pipefail
          version="$(git describe --tags --match 'v*' --long --dirty 2>/dev/null || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Stamping build version: ${version:-<none>}"

      # The Dockerfile's global CLI tools layer keys off this. An ISO week stamp
      # makes those @latest tools refresh weekly instead of freezing until an
      # unrelated cache bust.
      - name: Compute tool cache epoch
        id: tools-epoch
        run: echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # ghcr.io rejects uppercase in image names, and the owner here is not
      # lowercase, so github.repository cannot be used verbatim.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Pin the stage: the Dockerfile declares a later `cloud` stage, and
          # without a target the default would silently become that one.
          target: production
          # amd64 only. The arm64 half of a multi-arch build runs under QEMU
          # emulation and dominates the wall clock; add linux/arm64 back here
          # only if the deployment host is ARM.
          platforms: linux/amd64
          push: true
          build-args: |
            PAPERCLIP_BUILD_VERSION=${{ steps.version.outputs.version }}
            PAPERCLIP_BUILD_COMMIT=${{ github.sha }}
            CLI_TOOLS_CACHE_EPOCH=${{ steps.tools-epoch.outputs.epoch }}
          # :latest is what the deployment tracks. The commit tag gives every
          # build a stable identity to roll back to.
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
